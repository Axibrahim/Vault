name: Vault CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: container/requirements.txt

      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r container/requirements.txt
          pip install ruff bandit pip-audit

      - name: Check Python syntax
        run: python -m compileall -q container

      - name: Lint Python
        run: ruff check container

      - name: Static security analysis
        run: bandit -r container -ll

      - name: Audit dependencies
        run: pip-audit -r container/requirements.txt

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}